<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akun dan langganan | Pathora</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/header.css">
<link rel="stylesheet" href="assets/css/chat.css">
<link rel="stylesheet" href="assets/css/akun.css">
</head>
<body class="ak chat-mode">
<div class="ak-bg" aria-hidden="true"></div>
<div id="nav"></div>
<main class="ak-main" id="root"></main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/data-en.js"></script>
<script src="assets/js/en.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function(){
  const { ic } = PA, esc = UI.esc;
  if (!PAUTH.current()) { location.replace('masuk.html?next=akun.html'); return; }
  if (PAUTH.current().role === 'host') { location.replace('host.html'); return; }
  const root = document.getElementById('root');
  let open = false, pick = null;   /* pick: avatar yang sedang dipilih sebelum disimpan */
  function face(id){ return UI.avatarSVG(id) || esc(PS.me().ini); }
  function render(){
    const u = PAUTH.current(), plus = u.plan === 'plus';
    if (pick === null) pick = u.avatar || 'ini';
    root.innerHTML =
      '<h1>Akun dan langganan</h1><p class="ak-lede">Kelola profil dan paket kamu.</p>' +
      '<section class="ak-card ak-prof"><div class="ak-top"><span class="ak-ava" id="bigAva">' + face(pick === 'ini' ? '' : pick) + '</span>' +
        '<div><b>' + esc(u.name) + '</b><small>' + esc(u.email) + '</small></div><span class="sp"></span>' +
        '<button type="button" class="ak-bt" id="chg" aria-expanded="' + open + '">Ganti avatar</button></div>' +
        '<div class="ak-ed" id="ed"' + (open ? '' : ' hidden') + '><span class="ak-lb">Pilih avatar</span><div class="ak-grid" role="group" aria-label="Pilih avatar">' +
          '<button type="button" class="ak-pick" data-av="ini" aria-label="Inisial nama" aria-pressed="' + (pick === 'ini') + '"><span class="in">' + esc(PS.me().ini) + '</span></button>' +
          UI.AVATARS.map(function(a){ return '<button type="button" class="ak-pick" data-av="' + a.id + '" aria-label="' + esc(a.label) + '" aria-pressed="' + (pick === a.id) + '"><span class="in">' + UI.avatarSVG(a.id) + '</span></button>'; }).join('') +
        '</div><div class="ak-row"><div class="ak-fld"><label for="dn">Nama tampilan</label><input id="dn" value="' + esc(u.name) + '" maxlength="40" autocomplete="name"></div><button type="button" class="ak-bt pri" id="save">Simpan</button></div></div></section>' +
      '<div class="ak-plans">' +
        '<section class="ak-card ak-plan' + (!plus ? ' cur' : '') + '"><div><h2>Gratis</h2><div class="d">Untuk perencanaan sesekali</div></div><div class="ak-price">Rp0</div>' +
          '<ul><li><i>' + ic('check', 11) + '</i>5 pertanyaan ke asisten AI per hari</li><li><i>' + ic('check', 11) + '</i>Kalender trip dan pengajuan ke host</li><li><i>' + ic('check', 11) + '</i>Pembagian biaya dan Paspor Alam</li></ul>' +
          (!plus ? '<span class="ak-tag">Paket saat ini</span>' : '<button type="button" class="ak-bt" id="down">Kembali ke paket gratis</button>') + '</section>' +
        '<section class="ak-card ak-plan' + (plus ? ' cur' : '') + '"><div><h2>Pathora Plus</h2><div class="d">Untuk perencana yang rutin bepergian</div></div><div class="ak-price">Rp49.000<small>per bulan</small></div>' +
          '<ul><li><i>' + ic('check', 11) + '</i>Pertanyaan tanpa batas ke asisten AI</li><li><i>' + ic('check', 11) + '</i>Trip dan anggota tanpa batas</li><li><i>' + ic('check', 11) + '</i>Prakiraan keramaian untuk tanggal pilihan kamu</li></ul>' +
          (plus ? '<span class="ak-tag">Paket saat ini</span>' : '<button type="button" class="ak-bt pri" id="up">Mulai uji coba gratis 7 hari</button>') + '</section>' +
      '</div>';
    document.getElementById('chg').onclick = function(){ open = !open; pick = null; render(); };
    root.querySelectorAll('[data-av]').forEach(function(b){ b.onclick = function(){
      pick = b.dataset.av; const dn = document.getElementById('dn').value;
      root.querySelectorAll('[data-av]').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      document.getElementById('bigAva').innerHTML = face(pick === 'ini' ? '' : pick);
    }; });
    document.getElementById('save').onclick = function(){
      const nm = document.getElementById('dn').value.trim();
      if (!nm) { UI.toast('Nama tidak boleh kosong'); return; }
      PAUTH.update({ name: nm, avatar: pick === 'ini' ? '' : pick });
      open = false; pick = null; UI.mountNav('', 'dark'); render(); UI.toast('Profil disimpan');
    };
    const up = document.getElementById('up'); if (up) up.onclick = function(){ PAUTH.update({ plan:'plus' }); UI.toast('Pathora Plus aktif'); render(); };
    const dn2 = document.getElementById('down'); if (dn2) dn2.onclick = function(){ PAUTH.update({ plan:'gratis' }); UI.toast('Kembali ke paket gratis'); render(); };
  }
  UI.mountNav('', 'dark');
  render();
})();
</script>
</body>
</html>
