<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detail kegiatan — Pathora</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/header.css">
<link rel="stylesheet" href="assets/css/chat.css">
<link rel="stylesheet" href="assets/css/jelajahi.css">
<link rel="stylesheet" href="assets/css/kegiatan.css">
</head>
<body class="jel kd chat-mode">
<div id="nav"></div>
<div id="root"></div>
<div id="footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function(){
  const { A, byId, D, rp, crowdFor, CROWD_LABEL } = PD, { ic } = PA, esc = UI.esc;
  UI.mountNav('jelajahi', true); UI.mountFooter();
  const id = new URLSearchParams(location.search).get('id');
  const a = byId[id];
  const root = document.getElementById('root');
  if (!a) {
    root.innerHTML = '<div class="kd-empty"><h2 style="font:400 28px var(--g-display)">Kegiatan tidak ditemukan</h2><p style="margin:10px 0 22px;color:var(--g-mute)">Mungkin tautannya sudah berubah.</p><a class="btn" href="jelajahi.html">Kembali ke Jelajahi</a></div>';
    return;
  }
  document.title = a.name + ' — Pathora';

  /* warna aksen mengikuti kategori utama */
  const ACC = { laut: '#7CCBC0', air: '#7CCBC0', sawah: '#A9D18E', hutan: '#A9D18E', satwa: '#A9D18E', kuliner: '#E9C48A', budaya: '#E8895F', kerajinan: '#E8895F' };
  document.body.style.setProperty('--ac', ACC[a.cats[0]] || '#E8895F');

  const num = (n) => String(n).replace('.', ',');
  const clock = (t) => t.replace(':', '.');
  const hm = (t, off) => { const p = t.split(':').map(Number); const m = p[0] * 60 + p[1] + off; return String(Math.floor(m / 60)).padStart(2, '0') + '.' + String(m % 60).padStart(2, '0'); };
  const inTrip = () => PS.get().items.some((i) => i.actId === a.id && i.status !== 'ditolak');

  /* keramaian umum: rata-rata 28 hari ke depan */
  function typicalCrowd(){
    const t = D.today(); let sum = 0, n = 0;
    D.range(t, D.add(t, 27)).forEach((d) => { sum += crowdFor(a, d); n++; });
    return Math.min(2, Math.round(sum / n));
  }
  const CROWD_NOTE = ['Biasanya lengang dan tenang', 'Cukup ramai, tapi masih nyaman', 'Sering ramai, datang lebih awal'];

  /* durasi tiap tahap (menit) dari jam mulai tahap berikutnya */
  function stepsHtml(){
    const total = Math.round(a.dur * 60), t0 = a.times[0];
    return a.steps.map((x, i) => {
      const end = i + 1 < a.steps.length ? a.steps[i + 1][0] : total;
      return '<li><time>' + hm(t0, x[0]) + '</time><span>' + esc(x[1]) + '</span><em>' + (end - x[0]) + ' menit</em></li>';
    }).join('');
  }
  function related(){
    const sc = (o) => (o.cats.filter((c) => a.cats.indexOf(c) >= 0).length * 2) + (o.region === a.region ? 1 : 0);
    return A.filter((o) => o.id !== a.id).sort((x, y) => sc(y) - sc(x)).slice(0, 4);
  }

  function goBtn(){
    return inTrip()
      ? '<button type="button" class="kd-go on" data-go aria-label="Sudah ada di trip">Sudah di trip</button>'
      : '<button type="button" class="kd-go" data-go>Tambah ke trip</button>';
  }
  const askHref = 'trip.html?tab=chat&prompt=' + encodeURIComponent('Ceritakan ' + a.short.toLowerCase() + ' dan hari terbaik untuk mengikutinya');
  const sessions = a.times.map(clock).join(' atau ');
  const lv = typicalCrowd();

  root.innerHTML =
    '<div class="kd-bg" aria-hidden="true">' + PA.photo(a) + '</div>' +
    '<main class="kd-main">' +
      '<a href="jelajahi.html" class="kd-back">' + ic('back', 14) + ' Semua kegiatan</a>' +
      '<header class="kd-hero"><div>' +
        '<div class="kd-eb">' + a.cats.map(esc).join(' · ') + ' · ' + esc(a.place) + '</div>' +
        '<h1>' + esc(a.name) + '</h1>' +
        '<p class="kd-lede">' + esc(a.story) + '</p></div>' +
        '<aside class="kd-card" id="kdCard">' +
          '<div><div class="kd-price">' + rp(a.price) + '<small>/ orang</small></div><span class="kd-chip">Harga contoh</span></div>' +
          '<div><div class="kd-rw"><span>Titik kumpul</span><b>' + esc(a.meet) + '</b></div><div class="kd-rw"><span>Dipandu</span><b>' + esc(a.host.name) + '</b></div></div>' +
          '<div data-gowrap>' + goBtn() + '</div>' +
          '<a class="kd-ask" href="' + askHref + '">Tanya asisten</a>' +
          '<p class="kd-fn">Tanggal, jam, dan jumlah orang kamu pilih nanti di Kalender. Kamu belum ditagih apa pun.</p>' +
        '</aside></header>' +

      '<section class="kd-facts" aria-label="Sekilas">' +
        '<div><span class="l">Durasi</span><b>' + num(a.dur) + ' jam</b><span class="t">Mulai pukul ' + esc(sessions) + '</span></div>' +
        '<div><span class="l">Kelompok</span><b>Maks. ' + a.cap + ' orang</b><span class="t">Kelompok kecil, jadi tetap akrab</span></div>' +
        '<div><span class="l">Keramaian</span><b>' + CROWD_LABEL[lv] + '</b><span class="t">' + CROWD_NOTE[lv] + '</span></div>' +
        '<div><span class="l">Untuk anak</span><b>' + (a.kid ? 'Ramah anak' : 'Dewasa') + '</b><span class="t">' + (a.kid ? 'Anak yang sudah cukup besar boleh ikut' : 'Lebih cocok untuk remaja dan dewasa') + '</span></div>' +
      '</section>' +
      '<p class="kd-fit">' + esc(a.fit) + '</p>' +

      '<section class="kd-sec"><h2>Pengalaman yang akan kamu dapat</h2><div class="kd-three">' +
        a.hl.map((h, i) => '<div><i>0' + (i + 1) + '</i><p>' + esc(h) + '</p></div>').join('') + '</div></section>' +

      '<section class="kd-split"><div class="kd-arch"><div class="glow"></div><div class="ph">' + PA.photo(a) + '</div><span class="chip2">Sesi ' + esc(sessions) + '</span></div>' +
        '<div class="kd-tx"><div class="k">Urutan acara</div><h2>Sekitar ' + num(a.dur) + ' jam, dari awal sampai selesai.</h2>' +
        '<ul class="kd-tl">' + stepsHtml() + '</ul>' +
        '<p class="note">' + (a.times.length > 1 ? 'Jam mengikuti sesi pertama (' + clock(a.times[0]) + '). ' : '') + 'Urutan dapat berubah menyesuaikan kondisi di lapangan.</p></div></section>' +

      '<section class="kd-cols"><div><h3>Etika di lapangan</h3><ul>' + a.ethics.map((e) => '<li>' + esc(e) + '</li>').join('') + '</ul></div>' +
        '<div><h3>Yang perlu dibawa</h3><ul>' + a.bring.map((e) => '<li>' + esc(e) + '</li>').join('') + '</ul></div>' +
        '<div><h3>Dipandu oleh</h3><p><b>' + esc(a.host.name) + '</b><br>Bahasa: ' + esc(a.host.lang) + '<br>Titik kumpul: ' + esc(a.meet) + '</p>' +
        '<p>Host menyetujui atau menolak sesuai jadwal dan kuota. Pembayaran baru dibuka setelah disetujui.</p>' +
        '<p><b>Kontribusi untuk komunitas.</b> ' + esc(a.contrib) + '</p></div></section>' +

      '<section class="kd-more"><h2>Kegiatan lain yang mungkin cocok buat kamu</h2><div class="kd-rel" id="rel">' + related().map((r) => UI.actCard(r, {})).join('') + '</div></section>' +
    '</main>' +
    '<div class="kd-bar" id="kdBar" role="region" aria-label="Pesan cepat"><span class="p">' + rp(a.price) + '<small>/ orang</small></span><span class="sp"></span><a class="kd-ask" href="' + askHref + '">Tanya asisten</a><span data-gowrap>' + goBtn() + '</span></div>';

  UI.bindAdd(document.getElementById('rel'));

  /* tombol Tambah ke trip (hero dan bar bawah) */
  root.addEventListener('click', function(e){
    const b = e.target.closest('[data-go]'); if (!b) return;
    if (inTrip()) { location.href = 'trip.html'; return; }
    UI.quickAdd(a.id);
    root.querySelectorAll('[data-gowrap]').forEach((w) => { w.innerHTML = goBtn(); });
  });

  /* bar bawah muncul setelah kartu hero keluar dari layar, dan hilang saat footer terlihat */
  const card = document.getElementById('kdCard'), bar = document.getElementById('kdBar'), foot = document.querySelector('footer.footer');
  let past = false, atFoot = false;
  const upd = () => bar.classList.toggle('show', past && !atFoot);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(en){ past = !en[0].isIntersecting && en[0].boundingClientRect.top < 0; upd(); }, { threshold: 0 }).observe(card);
    if (foot) new IntersectionObserver(function(en){ atFoot = en[0].isIntersecting; upd(); }, { threshold: 0 }).observe(foot);
  } else { bar.classList.add('show'); }
})();
</script>
</body>
</html>
